    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
        
        /* 100% 不會破圖的 CSS 網格 3D Roblox 質感背景 */
        .roblox-sky-bg {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 2px, transparent 2px);
            background-size: 40px 40px;
            position: relative;
        }
        .roblox-sky-bg::before {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 35%;
            background: linear-gradient(0deg, #047857 0%, transparent 100%);
            opacity: 0.4;
            pointer-events: none;
        }

        /* 高科技玻璃擬物面板樣式 */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Roblox 核心純代碼角色與組件繪製組件 ---
        const RobloxAvatar = ({ type, size = "w-32 h-32" }) => {
            if (type === 'noob-teacher') {

            if (type === 'noob-blue') {

            if (type === 'roblox-arrow') {
                return (
                    <div class={`${size} bg-slate-800/90 rounded-2xl flex flex-col items-center justify-center relative border-4 border-amber-500 p-2 shadow-xl`}>
                        <div class="w-24 h-3 bg-amber-600 relative rounded-sm border border-slate-900">
                            <div class="absolute -right-3 -top-2 w-0 h-0 border-t-6 border-b-6 border-l-10 border-transparent border-l-red-500"></div>

            }
            if (type === 'roblox-key') {
                return (
                    <div class={`${size} bg-slate-800/90 rounded-2xl flex flex-col items-center justify-center relative border-4 border-yellow-400 p-2 shadow-xl`}>
                        <div class="w-10 h-10 rounded-full border-4 border-amber-400 shadow-md"></div>
                        <div class="w-3 h-10 bg-amber-400 -mt-1 relative rounded-b-sm">
                            <div class="w-4 h-2 bg-amber-400 absolute bottom-2 left-1.5"></div>
                            <div class="w-4 h-2 bg-amber-400 absolute bottom-5 left-1.5"></div>
                        </div>
                    </div>
                );
            }
            if (type === 'roblox-happy') {
                return (
                    <div class={`${size} bg-slate-800/90 rounded-2xl flex flex-col items-center justify-center relative border-4 border-emerald-400 p-2 shadow-xl`}>
                        <div class="w-14 h-14 bg-amber-300 rounded-lg flex flex-col items-center justify-center border-2 border-slate-900">
                            <div class="flex gap-2 mb-1"><div class="text-xs">⭐</div><div class="text-xs">⭐</div></div>
                            <div class="w-8 h-4 border-b-4 border-slate-900 rounded-b-full"></div>
                        </div>
                        <div class="text-xs text-yellow-300 font-black mt-2">拍手欣賞人哋</div>
                    </div>
                );
            }
            return <div class={`${size} bg-slate-600 rounded-2xl`}></div>;
        };

        // --- 完整 8 題題庫 ---
        const QUESTION_POOL = [
            {
                id: 1,
                audioText: '邊個係老師個師呀？',
                questionText: 'Roblox 學校的老「zi1」。',
                robloxContext: '👨‍🏫 學校場景：教導新手玩家的老師。',
                avatarType: 'noob-teacher',
                options: [
                    { text: '師', detail: '👨‍🏫 老師 / 導師', isCorrect: true, bg: 'from-emerald-600 to-teal-700' },
                    { text: '獅', detail: '🦁 獅子寵物', isCorrect: false, bg: 'from-rose-600 to-red-700' }
                ],
                hint: '提示：教你起屋、教你玩關卡嗰個「老師」。'
            },
            {
                id: 2,
                audioText: '邊個係獅子個獅呀？',
                questionText: '我在動物園看到一隻「zi1」子。',
                robloxContext: '🦁 動物園：這隻金黃色大鬃毛的動物！',
                avatarType: 'noob-lion',
                options: [
                    { text: '師', detail: '👨‍🏫 老師 / 導師', isCorrect: false, bg: 'from-rose-600 to-red-700' },
                    { text: '獅', detail: '🦁 獅子寵物', isCorrect: true, bg: 'from-emerald-600 to-teal-700' }
                ],
                hint: '提示：野生動物、會「吼」一聲大叫嘅金黃色獅子。'
            },
            {
                id: 3,
                audioText: '邊個係藍色個藍呀？',
                questionText: '穿上「laam4」色衫的Roblox。',
                robloxContext: '🟦 皮膚更換：像晴朗天空一樣的方塊上衣！',
                avatarType: 'noob-blue',
                options: [
                    { text: '男', detail: '👦 男生 / 爸爸 / 哥哥', isCorrect: false, bg: 'from-rose-600 to-red-700' },
                    { text: '藍', detail: '🟦 藍色 / 藍天', isCorrect: true, bg: 'from-emerald-600 to-teal-700' }
                ],
                hint: '提示：好似海水、好似防護罩顏色咁樣嘅「藍色」。'
            },
            {
                id: 4,
                audioText: '邊個係男仔個男呀？',
                questionText: '在冒險地圖中，跟隊伍內的「laam4」生玩家組隊。',
                robloxContext: '👦 組隊大廳：你的男性朋友或兄弟！',
                avatarType: 'noob-boy',
                options: [
                    { text: '男', detail: '👦 男生 / 爸爸 / 哥哥', isCorrect: true, bg: 'from-emerald-600 to-teal-700' },
                    { text: '藍', detail: '🟦 藍色 / 藍天', isCorrect: false, bg: 'from-rose-600 to-red-700' }
                ],
                hint: '提示：代表男仔、叔叔、哥哥，同女仔相對應。'
            },
            {
                id: 5,
                audioText: '邊個係知道個知呀？',
                questionText: '玩家看完了攻略大喊：「我 zi1 道怎樣過關了！」',
                robloxContext: '🧠 腦袋開光：我明白、我知道點解密啦！',
                avatarType: 'roblox-brain',
                options: [
                    { text: '知', detail: '🧠 知道 / 明白', isCorrect: true, bg: 'from-emerald-600 to-teal-700' },
                    { text: '支', detail: '🏹 一支箭 / 一支筆', isCorrect: false, bg: 'from-rose-600 to-red-700' }
                ],
                hint: '提示：小腦袋完全想通了，說「我知道」的知。'
            },
            {
                id: 6,
                audioText: '邊個係一支箭個支呀？',
                questionText: '在裝備欄裝備上一「zi1」箭。',
                robloxContext: '🏹 武器大師：拿出一支細細長長的遠程長箭！',
                avatarType: 'roblox-arrow',
                options: [
                    { text: '知', detail: '🧠 知道 / 明白', isCorrect: false, bg: 'from-rose-600 to-red-700' },
                    { text: '支', detail: '🏹 一支箭 / 一支筆', isCorrect: true, bg: 'from-emerald-600 to-teal-700' }
                ],
                hint: '提示：用嚟數長條形武器，例如「一支部隊」或「一支筆」。'
            },
            {
                id: 7,
                audioText: '邊個係因為個因呀？',
                questionText: '「jan1 為拿到了金鑰匙，所以順利打開寶箱」：',
                robloxContext: '🔑 原因解鎖：因為有對應的鑰匙，所以得到金幣！',
                avatarType: 'roblox-key',
                options: [
                    { text: '欣', detail: '😊 欣慰 / 欣賞', isCorrect: false, bg: 'from-rose-600 to-red-700' },
                    { text: '因', detail: '❔ 因為 / 原因', isCorrect: true, bg: 'from-emerald-600 to-teal-700' }
                ],
                hint: '提示：用來解釋事情前因後果時講嘅「因為」。'
            },
            {
                id: 8,
                audioText: '邊個係欣賞個欣呀？',
                questionText: '看見隊友蓋了非常漂亮的城堡，我表示「jan1」賞：',
                robloxContext: '🏰 建築評分：高興地為隊友的優秀作品拍拍手！',
                avatarType: 'roblox-happy',
                options: [
                    { text: '欣', detail: '😊 欣慰 / 欣賞', isCorrect: true, bg: 'from-emerald-600 to-teal-700' },
                    { text: '因', detail: '❔ 因為 / 原因', isCorrect: false, bg: 'from-rose-600 to-red-700' }
                ],
                hint: '提示：開高興興、心情好好去「欣賞」或者稱讚人哋。'
            }
        ];

        function App() {
            const [screen, setScreen] = useState('start'); 
            const [currentIdx, setCurrentIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [wrongAttempts, setWrongAttempts] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [feedback, setFeedback] = useState(null); 
            const [isMuted, setIsMuted] = useState(false);

            const audioContextRef = useRef(null);
            const bgmTimerRef = useRef(null);

            const currentQuestion = QUESTION_POOL[currentIdx];

            // 初始化音訊
            const initAudio = () => {
                if (!audioContextRef.current) {
                    audioContextRef.current = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContextRef.current.state === 'suspended') {
                    audioContextRef.current.resume();
                }
            };

            // 🎵 製作極其歡快、跳躍動感的 8-bit 電子旋律
            const playBGMStep = (ctx, gainNode, time, step) => {
                const melody = [
                    261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 261.63, 392.00,
                    293.66, 349.23, 440.00, 587.33, 440.00, 349.23, 293.66, 440.00
                ];
                
                const note = melody[step % melody.length];
                
                const osc = ctx.createOscillator();
                const noteGain = ctx.createGain();
                
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(note, time);
                
                // 【音量已調小】原本是 0.04，現在調整為 0.01，背景音會更柔和，絕不影響語音聽力
                noteGain.gain.setValueAtTime(0.01, time);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.18);
                
                osc.connect(noteGain);
                noteGain.connect(gainNode);
                osc.start(time);
                osc.stop(time + 0.2);
            };

            const startBGM = () => {
                try {
                    initAudio();
                    if (bgmTimerRef.current || isMuted) return;

                    const ctx = audioContextRef.current;
                    const mainGain = ctx.createGain();
                    mainGain.gain.setValueAtTime(1.0, ctx.currentTime);
                    mainGain.connect(ctx.destination);

                    let step = 0;
                    const tempo = 0.22; 

                    const scheduleAhead = () => {
                        let lookAhead = ctx.currentTime + 0.4;
                        let nextNoteTime = ctx.currentTime;
                        
                        while (nextNoteTime < lookAhead) {
                            playBGMStep(ctx, mainGain, nextNoteTime, step);
                            nextNoteTime += tempo;
                            step++;
                        }
                    };

                    bgmTimerRef.current = setInterval(scheduleAhead, 200);
                } catch(e) { console.log(e); }
            };

            const stopBGM = () => {
                if (bgmTimerRef.current) {
                    clearInterval(bgmTimerRef.current);
                    bgmTimerRef.current = null;
                }
            };

            // 答對 / 答錯 特效音 (特效音量也同步做舒服的調諧)
            const playSoundEffect = (type) => {
                if (isMuted) return;
                try {
                    initAudio();
                    const ctx = audioContextRef.current;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    if (type === 'correct') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.08); 
                        osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.16); 
                        gain.gain.setValueAtTime(0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                        osc.start(); osc.stop(ctx.currentTime + 0.4);
                    } else {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(160, ctx.currentTime);
                        osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.25);
                        gain.gain.setValueAtTime(0.06, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                        osc.start(); osc.stop(ctx.currentTime + 0.25);
                    }
                } catch(e){}
            };

            const toggleMute = () => {
                if (!isMuted) {
                    stopBGM();
                    setIsMuted(true);
                } else {
                    setIsMuted(false);
                    setTimeout(() => {
                        if (screen === 'game') startBGM();
                    }, 50);
                }
            };

            const playCantoneseSpeech = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-HK';
                    utterance.rate = 0.80; 
                    utterance.pitch = 1.1;
                    window.speechSynthesis.speak(utterance);
                }
            };

            useEffect(() => {
                if (screen === 'game' && currentQuestion) {
                    const timer = setTimeout(() => {
                        playCantoneseSpeech(currentQuestion.audioText);
                    }, 400);
                    return () => clearTimeout(timer);
                }
            }, [screen, currentIdx]);

            useEffect(() => {
                if (screen !== 'game') {
                    stopBGM();
                }
            }, [screen]);

            const handleStartGame = () => {
                setScreen('game');
                startBGM();
            };

            const handleAnswer = (isCorrect) => {
                if (feedback) return;

                if (isCorrect) {
                    setFeedback('correct');
                    playSoundEffect('correct');
                    playCantoneseSpeech('答對了！好叻呀！');
                    setScore(score + 1);
                    setTimeout(() => {
                        setFeedback(null);
                        setWrongAttempts(0);
                        setShowHint(false);
                        if (currentIdx + 1 < QUESTION_POOL.length) {
                            setCurrentIdx(currentIdx + 1);
                        } else {
                            setScreen('end');
                        }
                    }, 1600);
                } else {
                    setFeedback('wrong');
                    playSoundEffect('wrong');
                    playCantoneseSpeech('唔係呢個，再試一試？');
                    const nextWrong = wrongAttempts + 1;
                    setWrongAttempts(nextWrong);
                    if (nextWrong >= 1) {
                        setShowHint(true);
                    }
                    setTimeout(() => {
                        setFeedback(null);
                    }, 1200);
                }
            };

            const restartGame = () => {
                setCurrentIdx(0);
                setScore(0);
                setWrongAttempts(0);
                setShowHint(false);
                setFeedback(null);
                setScreen('game');
                startBGM();
            };

            return (
                <div class="flex-1 flex flex-col justify-between p-6 bg-gradient-to-b from-slate-900/10 to-slate-950/80 text-white relative">
                    
                    {/* 右上角高識別度靜音開關 */}
                    <button onClick={toggleMute} class="absolute top-4 right-4 z-50 bg-slate-950/80 p-3 rounded-full border-2 border-amber-400 active:scale-90 text-xl shadow-lg">
                        {isMuted ? '🔇 靜音模式' : '🎵 音樂播放中'}
                    </button>

                    {/* 開始畫面 */}
                    {screen === 'start' && (
                        <div class="flex-1 flex flex-col justify-between py-6 text-center">
                            <div class="mt-8 space-y-4">
                                <span class="bg-amber-400 text-slate-950 font-black px-5 py-1.5 rounded-full text-sm uppercase tracking-wider shadow-md animate-pulse">Roblox 豪華音效版</span>
                                <h1 class="text-4xl font-black text-amber-300 drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">同音字特訓挑戰</h1>
                                <p class="text-base text-slate-200 px-2 font-bold">配合方塊人提示，聽廣東話語音，分清 8 道關卡！</p>
                            </div>
                            
                            <div class="my-auto flex flex-col items-center animate-bounce-slow gap-4 py-6">
                                <div class="flex gap-4">
                                    <RobloxAvatar type="noob-teacher" />
                                    <RobloxAvatar type="noob-blue" />
                                </div>
                                <div class="text-base bg-slate-950/90 border border-amber-400 px-6 py-2 rounded-full font-mono font-black text-amber-400 shadow-lg">
                                    知/支 • 因/欣 • 獅/師 • 藍/男
                                </div>
                            </div>

                            <button onClick={handleStartGame} class="w-full py-5 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 font-black text-2xl rounded-2xl shadow-2xl active:scale-95 transition-all border-b-4 border-orange-700">
                                🎮 開啟歡快音樂並出發
                            </button>
                        </div>
                    )}

                    {/* 遊戲畫面 */}
                    {screen === 'game' && (
                        <div class="flex-1 flex flex-col justify-between py-2">
                            {/* 頂部狀態欄 */}
                            <div class="flex justify-between items-center bg-slate-950/90 px-5 py-3 rounded-full text-sm font-black border border-slate-700 shadow-md">
                                <span class="text-amber-400">關卡: {currentIdx + 1} / {QUESTION_POOL.length}</span>
                                <span class="text-emerald-400">目前得分: {score}</span>
                            </div>

                            {/* 核心區：半透明科幻感玻璃擬物面板 (glass-panel) */}
                            <div class="glass-panel rounded-3xl p-6 my-4 text-center space-y-4 flex flex-col items-center shadow-2xl">
                                <RobloxAvatar type={currentQuestion.avatarType} />
                                
                                <div class="space-y-2">
                                    <p class="text-sm text-amber-300 font-black tracking-wide bg-amber-400/20 px-3 py-1 rounded-md border border-amber-400/30">{currentQuestion.robloxContext}</p>
                                    <h2 class="text-2xl font-black text-white px-1 leading-snug drop-shadow-md">{currentQuestion.questionText}</h2>
                                </div>
                                
                                <button onClick={() => playCantoneseSpeech(currentQuestion.audioText)} class="inline-flex items-center gap-3 px-6 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black rounded-full shadow-lg active:scale-95 transition-all text-sm border-b-2 border-amber-600">
                                    🔊 再聽一次讀音
                                </button>
                            </div>

                            {/* 提示與反饋區 */}
                            <div class="h-16 flex items-center justify-center text-center px-2">
                                {feedback === 'correct' && <span class="text-2xl font-black text-emerald-400 drop-shadow-lg animate-bounce">🎉 太厲害了！答對了！</span>}
                                {feedback === 'wrong' && <span class="text-2xl font-black text-rose-400 drop-shadow-lg">❌ 睇清楚提示，再試下！</span>}
                                {!feedback && showHint && (
                                    <div class="w-full bg-slate-950/90 border-2 border-amber-400 text-amber-300 text-sm font-black p-3 rounded-2xl shadow-inner animate-pulse">
                                        💡 {currentQuestion.hint}
                                    </div>
                                )}
                            </div>

                            {/* 超大字卡選擇區 */}
                            <div class="space-y-4 mb-2">
                                {currentQuestion.options.map((opt, idx) => (
                                    <button key={idx} onClick={() => handleAnswer(opt.isCorrect)} class={`w-full p-5 bg-gradient-to-r ${opt.bg} border-b-4 border-black/40 rounded-2xl active:border-b-0 active:scale-98 transition-all flex items-center justify-between shadow-xl group`}>
                                        <div class="flex flex-col text-left">
                                            <span class="text-xs text-white/80 font-black uppercase tracking-wider">字義解釋</span>
                                            <span class="text-lg font-black text-white mt-1 drop-shadow-sm">{opt.detail}</span>
                                        </div>
                                        <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center text-5xl font-black text-white border-2 border-white/30 shadow-md group-hover:scale-105 transition-transform">
                                            {opt.text}
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 結算畫面 */}
                    {screen === 'end' && (
                        <div class="flex-1 flex flex-col justify-between text-center py-6">
                            <div class="my-auto space-y-6">
                                <div class="text-8xl animate-bounce">🏆</div>
                                <h1 class="text-4xl font-black text-amber-300 drop-shadow-lg">8關全數通過！</h1>
                                <p class="text-lg text-slate-100 bg-slate-950/90 p-6 rounded-3xl border-2 border-emerald-500 max-w-sm mx-auto leading-relaxed shadow-2xl">
                                    太棒了！你非常有耐性！<br />
                                    成功挑戰全部 8 個關卡！<br />
                                    你已經完全分得清這 4 組字喇！
                                </p>
                            </div>
                            <button onClick={restartGame} class="w-full py-5 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-2xl rounded-2xl shadow-xl active:scale-95 transition-all border-b-4 border-teal-800">
                                🔄 重新大特訓
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
